name: Bootstrap application database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create roles and initialise schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: database-bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        shell: bash
        env:
          SUPERUSER_DATABASE_URL: ${{ secrets.SUPERUSER_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_RUNNER_PASSWORD: ${{ secrets.MIGRATION_RUNNER_PASSWORD }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SUPERUSER_DATABASE_URL" ]] || { echo "::error::SUPERUSER_DATABASE_URL is not configured on the database-bootstrap environment."; exit 1; }
          [[ -n "$MIGRATION_DATABASE_URL" ]] || { echo "::error::MIGRATION_DATABASE_URL is not configured on the database-bootstrap environment."; exit 1; }
          [[ -n "$MIGRATION_RUNNER_PASSWORD" ]] || { echo "::error::MIGRATION_RUNNER_PASSWORD is not configured on the database-bootstrap environment."; exit 1; }
          [[ -n "$APP_RUNTIME_PASSWORD" ]] || { echo "::error::APP_RUNTIME_PASSWORD is not configured on the database-bootstrap environment."; exit 1; }

      - name: Create database roles
        shell: bash
        env:
          SUPERUSER_DATABASE_URL: ${{ secrets.SUPERUSER_DATABASE_URL }}
          MIGRATION_RUNNER_PASSWORD: ${{ secrets.MIGRATION_RUNNER_PASSWORD }}
          APP_RUNTIME_PASSWORD: ${{ secrets.APP_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          psql "$SUPERUSER_DATABASE_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            -v migration_runner_password="$MIGRATION_RUNNER_PASSWORD" \
            -v app_runtime_password="$APP_RUNTIME_PASSWORD" \
            -f src/database/bootstrap/create_roles.sql

      - name: Apply initial migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PGOPTIONS: "-c statement_timeout=60000"
        run: scripts/run_migrations.sh
