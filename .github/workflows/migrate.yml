name: Run database migrations manually

# Recovery/operations entry point. Normal releases run the same script from release.yml before
# publishing Lambda packages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "$MIGRATION_DATABASE_URL" ]] || { echo "::error::MIGRATION_DATABASE_URL is not configured on the production environment."; exit 1; }

      - name: Apply migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PGOPTIONS: "-c statement_timeout=60000"
        run: scripts/run_migrations.sh
