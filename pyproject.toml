[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tango-music-game-backend"
version = "0.1.0"
description = "Game generation, preview resolution, and feedback backend"
requires-python = ">=3.12"
dependencies = [
  "aws-lambda-powertools>=2.40,<4",
  "boto3>=1.34,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
